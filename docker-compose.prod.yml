services:
  web:
    build: .
    image: zetac-website
    container_name: zetac-website
    # Reachable only via the shared nginx-proxy (zetac.de); no public host port.
    environment:
      # Register with the shared nginx-proxy + acme-companion for HTTPS
      VIRTUAL_HOST: zetac.de
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: zetac.de
      LETSENCRYPT_EMAIL: info@zetac.de
    networks:
      - default
      - proxy
    restart: unless-stopped

  # Kontakt form mailer: receives /api/kontakt from the web container (internal network
  # only, no public port) and sends it to info@zetac.de via SMTP. SMTP settings come from
  # .env next to this file (see mailer/env.example); never commit that file.
  mailer:
    build: ./mailer
    image: zetac-mailer
    container_name: zetac-mailer
    env_file:
      - path: .env
        required: false
    networks:
      - default
    restart: unless-stopped

networks:
  # default: implicit per-stack bridge
  default:
  # shared reverse-proxy network, created/owned by /root/reverse-proxy
  proxy:
    external: true
