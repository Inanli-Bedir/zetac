server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # text/css is absent from nginx's default charset_types, and styles.css has
    # no @charset rule — without this it relies on the browser inheriting the
    # page encoding.
    charset       utf-8;
    charset_types text/css text/plain text/xml application/javascript text/javascript image/svg+xml;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript text/javascript image/svg+xml;

    # Also resolves /about and /projects/stockflow, alongside the explicit
    # .html links the pages already use.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # styles.css and the js files carry no content hash, so a long max-age
    # would pin visitors to a stale copy after a deploy.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(jpe?g|png|gif|webp|avif|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
    }
}
