server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # text/css is absent from nginx's default charset_types, and styles.css has
    # no @charset rule — without this it relies on the browser inheriting the
    # page encoding.
    charset       utf-8;
    charset_types text/css text/plain text/xml application/javascript text/javascript image/svg+xml;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript text/javascript image/svg+xml;

    # Kontakt form → the mailer container (docker-compose.prod.yml), which emails
    # info@zetac.de. Resolved at request time via Docker's DNS, so nginx still starts
    # if the mailer is down (the form then shows its error message).
    location = /api/kontakt {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $mailer http://zetac-mailer:3000;   # unique container name (the proxy network is shared)
        client_max_body_size 32k;
        proxy_pass $mailer;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        # nginx-proxy in front sets X-Real-IP to the visitor's address (used for the
        # mailer's rate limit; unlike X-Forwarded-For, a client can't prepend to it).
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # Also resolves /about and /projects/stockflow, alongside the explicit
    # .html links the pages already use.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # styles.css and the js files carry no content hash, so a long max-age
    # would pin visitors to a stale copy after a deploy.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(jpe?g|png|gif|webp|avif|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
    }
}
